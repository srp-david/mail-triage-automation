# Draft only. Move to .github/workflows after D6 and release readiness approval.
name: windows-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numeric release version, for example 0.3.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4 # Pin reviewed action commit before activation.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx vitest run --project unit test/installer.test.ts test/runner.test.ts test/v1-auth.test.ts
      - run: node scripts/package-windows.mjs $env:RELEASE_VERSION
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      # Follow docs/operations/releases.md and docs/templates/release-notes.md.
      # No publish/upload step until repository access and signing policy are set.
